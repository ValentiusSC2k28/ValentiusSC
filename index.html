<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16137A" />
  <title>Hue &amp; Harmony</title>
  <!-- When you upload new files, raise this number here AND in every ?v= below,
       so every phone picks up the new version. -->
  <script>window.HH_VERSION = '1';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=1" />
  <style id="custom-css"></style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- Shown while the app starts -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="wordmark wm-big"><span class="wm-top">HUE &amp;</span><span class="wm-bottom">HARMONY</span></div>
      <div class="spinner" aria-label="Loading"></div>
    </div>
  </div>

  <!-- Sign-in (name + PIN + team) -->
  <div id="join" class="join" hidden></div>

  <!-- The player app -->
  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <a href="#/home" class="topbar-brand" aria-label="Home"><span class="wm-mini"><span>HUE&nbsp;&amp;</span> HARMONY</span></a>
      <span id="team-chip" class="team-chip"></span>
      <button class="icon-btn" data-act="nav.open" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </header>
    <div id="offline" class="offline" hidden></div>
    <main id="view" class="view"></main>
    <footer class="foot"><small data-brand="footer"></small></footer>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <div class="drawer-back" data-act="nav.close"></div>
    <aside class="drawer" aria-label="Menu">
      <div class="drawer-head"><strong data-brand="name">Hue &amp; Harmony</strong>
        <button class="icon-btn" data-act="nav.close" aria-label="Close menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <nav id="drawer-list" class="drawer-list"></nav>
    </aside>
  </div>

  <!-- Admin dashboard -->
  <div id="admin" class="admin" hidden></div>

  <!-- Overlays -->
  <div id="reveal" class="reveal" hidden></div>
  <canvas id="confetti" class="confetti" hidden></canvas>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
  <div id="print-area" class="print-area"></div>

  <script src="supabase.js?v=1"></script>
  <script src="script.js?v=1"></script>
  <script src="lms.js?v=1"></script>
  <script src="hunt.js?v=1"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
